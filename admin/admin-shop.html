<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Meta_Earn Shop Management</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{

    background:
    radial-gradient(circle at top,#0b1220,#050913);

    color:white;

    min-height:100vh;

}

/* HEADER */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 30px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(15px);

    border-bottom:
    1px solid rgba(255,255,255,.08);

}

.logo{

    font-size:27px;

    font-weight:800;

    color:#38bdf8;

}

.header-right{

    display:flex;

    align-items:center;

    gap:15px;

}

.admin-name{

    color:#22c55e;

    font-weight:700;

}

.back-btn{

    border:none;

    padding:11px 18px;

    border-radius:9px;

    color:white;

    cursor:pointer;

    font-weight:700;

    background:
    linear-gradient(135deg,#6366f1,#2563eb);

}

.logout{

    border:none;

    padding:11px 18px;

    border-radius:9px;

    color:white;

    cursor:pointer;

    font-weight:700;

    background:
    linear-gradient(135deg,#ef4444,#dc2626);

}

/* CONTAINER */

.container{

    padding:30px;

    max-width:1600px;

    margin:auto;

}

/* TITLE */

.page-title{

    margin-bottom:30px;

}

.page-title h1{

    font-size:34px;

    margin-bottom:8px;

}

.page-title p{

    color:#94a3b8;

}

/* STATISTICS */

.stats{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin-bottom:30px;

}

.stat{

    padding:23px;

    border-radius:17px;

    background:
    rgba(255,255,255,.06);

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 20px rgba(37,99,235,.15);

}

.stat-icon{

    font-size:28px;

    margin-bottom:12px;

}

.stat-title{

    color:#94a3b8;

    font-size:14px;

    margin-bottom:8px;

}

.stat-value{

    font-size:30px;

    font-weight:800;

}

/* ACTION BAR */

.action-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    margin-bottom:20px;

}

.search-box{

    flex:1;

    min-width:250px;

}

.search-box input{

    width:100%;

    padding:13px 16px;

    border-radius:10px;

    border:
    1px solid rgba(255,255,255,.1);

    background:
    rgba(255,255,255,.06);

    color:white;

    outline:none;

}

.search-box input::placeholder{

    color:#64748b;

}

.add-btn{

    border:none;

    padding:13px 22px;

    border-radius:10px;

    cursor:pointer;

    color:white;

    font-weight:700;

    background:
    linear-gradient(135deg,#22c55e,#16a34a);

}

.add-btn:hover{

    transform:translateY(-2px);

}

/* FILTERS */

.filters{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:20px;

}

.filters select{

    padding:12px 15px;

    border-radius:9px;

    border:
    1px solid rgba(255,255,255,.1);

    background:#111827;

    color:white;

    outline:none;

}

/* TABLE */

.table-container{

    width:100%;

    overflow-x:auto;

    border-radius:16px;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.08);

}

table{

    width:100%;

    border-collapse:collapse;

    min-width:1000px;

}

thead{

    background:
    rgba(255,255,255,.07);

}

th{

    padding:16px;

    text-align:left;

    font-size:13px;

    color:#94a3b8;

    text-transform:uppercase;

}

td{

    padding:15px;

    border-top:
    1px solid rgba(255,255,255,.06);

}

.product-image{

    width:55px;

    height:55px;

    object-fit:cover;

    border-radius:9px;

    background:#111827;

}

.product-name{

    font-weight:700;

}

.product-description{

    color:#64748b;

    font-size:12px;

    margin-top:4px;

}

.price{

    color:#22c55e;

    font-weight:800;

}

.stock-good{

    color:#22c55e;

    font-weight:700;

}

.stock-low{

    color:#f59e0b;

    font-weight:700;

}

.stock-out{

    color:#ef4444;

    font-weight:700;

}

/* STATUS */

.status{

    display:inline-block;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:700;

}

.status-active{

    background:
    rgba(34,197,94,.15);

    color:#22c55e;

}

.status-inactive{

    background:
    rgba(239,68,68,.15);

    color:#ef4444;

}

/* ACTIONS */

.actions{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

}

.action-btn{

    border:none;

    padding:8px 11px;

    border-radius:7px;

    color:white;

    cursor:pointer;

    font-size:12px;

    font-weight:700;

}

.edit{

    background:#2563eb;

}

.delete{

    background:#dc2626;

}

.toggle{

    background:#7c3aed;

}

/* EMPTY */

.empty{

    text-align:center;

    padding:50px;

    color:#64748b;

}

.error-message{

    color:#f87171;

    font-size:14px;

    line-height:1.6;

}

/* MODAL */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.75);

    backdrop-filter:blur(6px);

    z-index:1000;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.modal.active{

    display:flex;

}

.modal-content{

    width:100%;

    max-width:650px;

    max-height:90vh;

    overflow-y:auto;

    padding:30px;

    border-radius:18px;

    background:#0b1220;

    border:
    1px solid rgba(255,255,255,.1);

    box-shadow:
    0 20px 60px rgba(0,0,0,.5);

}

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}

.modal-header h2{

    font-size:23px;

}

.close{

    border:none;

    background:none;

    color:white;

    font-size:28px;

    cursor:pointer;

}

.form-group{

    margin-bottom:17px;

}

.form-group label{

    display:block;

    margin-bottom:7px;

    color:#cbd5e1;

    font-size:14px;

    font-weight:600;

}

.form-group input,

.form-group textarea,

.form-group select{

    width:100%;

    padding:12px 14px;

    border-radius:9px;

    border:
    1px solid rgba(255,255,255,.1);

    background:#111827;

    color:white;

    outline:none;

}

.form-group textarea{

    min-height:100px;

    resize:vertical;

}

.form-actions{

    display:flex;

    gap:10px;

    margin-top:25px;

}

.save-btn{

    flex:1;

    border:none;

    padding:13px;

    border-radius:9px;

    background:
    linear-gradient(135deg,#22c55e,#16a34a);

    color:white;

    font-weight:700;

    cursor:pointer;

}

.cancel-btn{

    flex:1;

    border:none;

    padding:13px;

    border-radius:9px;

    background:#374151;

    color:white;

    font-weight:700;

    cursor:pointer;

}

/* LOADING */

.loading{

    text-align:center;

    padding:40px;

    color:#94a3b8;

}

/* RESPONSIVE */

@media(max-width:700px){

    .header{

        flex-direction:column;

        gap:15px;

        align-items:flex-start;

    }

    .header-right{

        width:100%;

        flex-wrap:wrap;

    }

    .container{

        padding:18px;

    }

    .page-title h1{

        font-size:27px;

    }

}

</style>

</head>

const token =
localStorage.getItem("adminToken");

if(!token){

<!-- HEADER -->

<script>

/* =====================================================
   META EARN SHOP ADMIN
   FIXED VERSION
===================================================== */


/* =====================================================
   ADMIN AUTHENTICATION
===================================================== */

const adminToken = localStorage.getItem("adminToken");

if (!adminToken) {
    window.location.href = "admin-login.html";
}


/* =====================================================
   API CONFIGURATION
===================================================== */

const API =
    "https://meta-earn-14.onrender.com/api/admin/shop";


/*
 * Keep this alias because some old functions were using
 * SHOP_ADMIN_API.
 */
const SHOP_ADMIN_API = API;


/* =====================================================
   GLOBAL DATA
===================================================== */

let products = [];

let categories = [];

let editingProductId = null;


/* =====================================================
   ADMIN NAME
===================================================== */

const adminUser =
    JSON.parse(
        localStorage.getItem("adminUser") || "null"
    );

if (adminUser) {

    document.getElementById("adminName").textContent =
        adminUser.username ||
        adminUser.name ||
        adminUser.employee_no ||
        "Administrator";

}


/* =====================================================
   API HEADERS
===================================================== */

function getHeaders() {

    const currentToken =
        localStorage.getItem("adminToken");

    const headers = {
        "Content-Type": "application/json"
    };

    if (currentToken) {
        headers["Authorization"] =
            `Bearer ${currentToken}`;
    }

    return headers;

}


/* =====================================================
   GENERIC API REQUEST
===================================================== */

async function apiRequest(
    url,
    options = {}
) {

    try {

        const response =
            await fetch(
                url,
                {
                    ...options,

                    headers: {
                        ...getHeaders(),
                        ...(options.headers || {})
                    }
                }
            );


        let data = null;


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            data =
                await response.json();

        } else {

            const text =
                await response.text();

            data = {
                message:
                    text ||
                    "No response from server"
            };

        }


        if (!response.ok) {

            /*
             * If token has expired or admin is unauthorized
             */
            if (
                response.status === 401
            ) {

                console.error(
                    "Admin authentication failed."
                );

            }


            throw new Error(

                data?.message ||
                data?.error ||
                `HTTP ${response.status}`

            );

        }


        return data;

    }

    catch (error) {

        console.error(
            "API REQUEST ERROR:",
            error
        );

        throw error;

    }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    if (
        confirm(
            "Logout from admin panel?"
        )
    ) {

        localStorage.removeItem(
            "adminToken"
        );

        localStorage.removeItem(
            "adminUser"
        );

        window.location.href =
            "admin-login.html";

    }

}


/* =====================================================
   BACK TO ADMIN DASHBOARD
===================================================== */

function goBack() {

    window.location.href =
        "admin-admin.html";

}


/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories() {

    try {

        console.log(
            "GET:",
            `${API}/categories`
        );


        const data =
            await apiRequest(
                `${API}/categories`,
                {
                    method: "GET"
                }
            );


        /*
         * Backend may return:
         *
         * {
         *   success:true,
         *   categories:[]
         * }
         *
         * or directly []
         */

        if (
            Array.isArray(data)
        ) {

            categories = data;

        }
        else if (
            Array.isArray(
                data.categories
            )
        ) {

            categories =
                data.categories;

        }
        else {

            categories = [];

        }


        console.log(
            "Categories loaded:",
            categories
        );


        populateCategories();


        return categories;

    }

    catch (error) {

        console.error(
            "Category loading error:",
            error
        );


        categories = [];


        populateCategories();


        return [];

    }

}


/* =====================================================
   POPULATE CATEGORY SELECTS
===================================================== */

function populateCategories() {

    const filter =
        document.getElementById(
            "categoryFilter"
        );


    const productCategory =
        document.getElementById(
            "productCategory"
        );


    if (!filter || !productCategory) {
        return;
    }


    filter.innerHTML = `
        <option value="">
            All Categories
        </option>
    `;


    productCategory.innerHTML = `
        <option value="">
            Select category
        </option>
    `;


    categories.forEach(
        category => {

            const id =
                category.id ??
                category.category_id;


            const name =
                category.name ||
                category.category_name ||
                "Unnamed";


            filter.innerHTML += `

                <option
                    value="${escapeAttribute(id)}">

                    ${escapeHtml(name)}

                </option>

            `;


            productCategory.innerHTML += `

                <option
                    value="${escapeAttribute(id)}">

                    ${escapeHtml(name)}

                </option>

            `;

        }
    );


    document.getElementById(
        "totalCategories"
    ).textContent =
        categories.length;

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    const table =
        document.getElementById(
            "productTable"
        );


    table.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading">

                Loading products...

            </td>

        </tr>

    `;


    try {

        console.log(
            "GET:",
            `${API}/products`
        );


        const data =
            await apiRequest(
                `${API}/products`,
                {
                    method: "GET"
                }
            );


        /*
         * Support both:
         *
         * []
         *
         * and:
         *
         * {
         *   success:true,
         *   products:[]
         * }
         */

        if (
            Array.isArray(data)
        ) {

            products = data;

        }
        else if (
            Array.isArray(
                data.products
            )
        ) {

            products =
                data.products;

        }
        else {

            products = [];

        }


        console.log(
            "Products loaded:",
            products
        );


        renderProducts(
            products
        );


        updateStatistics();


        return products;

    }

    catch (error) {

        console.error(
            "Product loading error:",
            error
        );


        products = [];


        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    <div class="error-message">

                        ❌ Unable to load products.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                        <br><br>

                        <button
                            class="add-btn"
                            onclick="loadShop()">

                            🔄 Try Again

                        </button>

                    </div>

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   LOAD STATISTICS
===================================================== */

async function loadStatistics() {

    console.log(
        "GET:",
        `${API}/statistics`
    );


    try {

        const data =
            await apiRequest(
                `${API}/statistics`,
                {
                    method: "GET"
                }
            );


        console.log(
            "Shop statistics:",
            data.statistics
        );


        const stats =
            data.statistics || {};


        if (
            document.getElementById(
                "totalProducts"
            )
        ) {

            document.getElementById(
                "totalProducts"
            ).textContent =
                Number(
                    stats.products || 0
                );

        }


        if (
            document.getElementById(
                "activeProducts"
            )
        ) {

            document.getElementById(
                "activeProducts"
            ).textContent =
                Number(
                    stats.active_products || 0
                );

        }


        if (
            document.getElementById(
                "lowStock"
            )
        ) {

            document.getElementById(
                "lowStock"
            ).textContent =
                products.filter(
                    p =>
                        Number(
                            p.stock || 0
                        ) <= 5
                ).length;

        }


        if (
            document.getElementById(
                "totalCategories"
            )
        ) {

            document.getElementById(
                "totalCategories"
            ).textContent =
                Number(
                    stats.categories || 0
                );

        }


        return stats;

    } catch (error) {

        console.error(
            "Statistics loading error:",
            error
        );


        throw error;

    }

}


/* =====================================================
   MAIN SHOP LOADER
===================================================== */

async function loadShop() {

    console.log(
        "===================================="
    );

    console.log(
        "LOADING META EARN SHOP"
    );

    console.log(
        "===================================="
    );


    try {

        /*
         * Load categories FIRST.
         *
         * Products need categories when
         * rendering the table.
         */

        await loadCategories();


        /*
         * Then load products.
         */

        await loadProducts();


        /*
         * Statistics endpoint is optional.
         */

        await loadStatistics();


        /*
         * Recalculate statistics from
         * the products we actually loaded.
         */

        updateStatistics();


        console.log(
            "SHOP LOADED SUCCESSFULLY"
        );

    }

    catch (error) {

        console.error(
            "SHOP LOAD ERROR:",
            error
        );

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(list) {

    const table =
        document.getElementById(
            "productTable"
        );


    if (
        !Array.isArray(list) ||
        !list.length
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    No products found.

                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML = "";


    list.forEach(
        product => {

            const id =
                product.id ??
                product.product_id;


            const categoryId =
                product.category_id;


            const category =
                categories.find(
                    c =>
                        String(
                            c.id ??
                            c.category_id
                        )
                        ===
                        String(
                            categoryId
                        )
                );


            const categoryName =
                product.category_name ||
                (
                    category
                    ?
                    (
                        category.name ||
                        category.category_name
                    )
                    :
                    "Unknown"
                );


            const name =
                product.name ||
                "Unnamed Product";


            const description =
                product.description ||
                "";


            const price =
                Number(
                    product.price || 0
                );


            const stock =
                Number(
                    product.stock || 0
                );


            const status =
                product.status ||
                "active";


            let stockClass =
                "stock-good";


            if (
                stock === 0
            ) {

                stockClass =
                    "stock-out";

            }
            else if (
                stock <= 5
            ) {

                stockClass =
                    "stock-low";

            }


            const image =
                product.image ||
                product.image_url ||
                "https://via.placeholder.com/100";


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>

                    <img
                        class="product-image"
                        src="${escapeAttribute(image)}"
                        onerror="
                            this.src='https://via.placeholder.com/100'
                        "
                        alt="Product">

                </td>


                <td>

                    <div class="product-name">

                        ${escapeHtml(name)}

                    </div>

                    <div class="product-description">

                        ${escapeHtml(
                            description.substring(
                                0,
                                70
                            )
                        )}

                    </div>

                </td>


                <td>

                    ${escapeHtml(
                        categoryName
                    )}

                </td>


                <td class="price">

                    ${price.toLocaleString(
                        "en-US",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    )}

                </td>


                <td class="${stockClass}">

                    ${stock}

                </td>


                <td>

                    <span
                        class="
                            status
                            ${
                                status === "active"
                                ?
                                "status-active"
                                :
                                "status-inactive"
                            }
                        ">

                        ${escapeHtml(status)}

                    </span>

                </td>


                <td>

                    <div class="actions">

                        <button
                            class="action-btn edit"
                            onclick="editProduct(${Number(id)})">

                            Edit

                        </button>


                        <button
                            class="action-btn toggle"
                            onclick="toggleProduct(${Number(id)})">

                            ${
                                status === "active"
                                ?
                                "Disable"
                                :
                                "Activate"
                            }

                        </button>


                        <button
                            class="action-btn delete"
                            onclick="deleteProduct(${Number(id)})">

                            Delete

                        </button>

                    </div>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   FILTER PRODUCTS
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const stockFilter =
        document.getElementById(
            "stockFilter"
        ).value;


    const filtered =
        products.filter(
            product => {

                const name =
                    (
                        product.name ||
                        ""
                    )
                    .toLowerCase();


                const description =
                    (
                        product.description ||
                        ""
                    )
                    .toLowerCase();


                const categoryName =
                    (
                        product.category_name ||
                        ""
                    )
                    .toLowerCase();


                const categoryId =
                    product.category_id;


                const productStatus =
                    product.status ||
                    "active";


                const stock =
                    Number(
                        product.stock || 0
                    );


                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    description.includes(search) ||
                    categoryName.includes(search);


                const matchesCategory =
                    !category ||
                    String(categoryId) ===
                    String(category);


                const matchesStatus =
                    !status ||
                    productStatus === status;


                let matchesStock = true;


                if (
                    stockFilter === "available"
                ) {

                    matchesStock =
                        stock > 5;

                }


                if (
                    stockFilter === "low"
                ) {

                    matchesStock =
                        stock > 0 &&
                        stock <= 5;

                }


                if (
                    stockFilter === "out"
                ) {

                    matchesStock =
                        stock === 0;

                }


                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesStatus &&
                    matchesStock
                );

            }
        );


    renderProducts(
        filtered
    );

}


/* =====================================================
   UPDATE STATISTICS
===================================================== */

function updateStatistics() {

    document.getElementById(
        "totalProducts"
    ).textContent =
        products.length;


    document.getElementById(
        "activeProducts"
    ).textContent =

        products.filter(
            p =>
                (
                    p.status ||
                    "active"
                ) === "active"
        ).length;


    document.getElementById(
        "lowStock"
    ).textContent =

        products.filter(
            p =>
                Number(
                    p.stock || 0
                ) <= 5
        ).length;


    document.getElementById(
        "totalCategories"
    ).textContent =
        categories.length;

}


/* =====================================================
   OPEN ADD PRODUCT
===================================================== */

function openAddProduct() {

    editingProductId =
        null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Product";


    document.getElementById(
        "productForm"
    ).reset();


    document.getElementById(
        "productId"
    ).value = "";


    document.getElementById(
        "productStatus"
    ).value =
        "active";


    document.getElementById(
        "productModal"
    ).classList.add(
        "active"
    );

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id) {

    const product =
        products.find(
            p =>
                String(
                    p.id ??
                    p.product_id
                ) ===
                String(id)
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    editingProductId =
        id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "productId"
    ).value =
        id;


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productCategory"
    ).value =
        product.category_id || "";


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price || 0;


    document.getElementById(
        "productStock"
    ).value =
        product.stock || 0;


    document.getElementById(
        "productImage"
    ).value =
        product.image ||
        product.image_url ||
        "";


    document.getElementById(
        "productStatus"
    ).value =
        product.status ||
        "active";


    document.getElementById(
        "productModal"
    ).classList.add(
        "active"
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

    document.getElementById(
        "productModal"
    ).classList.remove(
        "active"
    );

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(
    event
) {

    event.preventDefault();


    const id =
        document.getElementById(
            "productId"
        ).value;


    const categoryValue =
        document.getElementById(
            "productCategory"
        ).value;


    const productData = {

        category_id:
            categoryValue
            ?
            Number(categoryValue)
            :
            null,


        name:
            document.getElementById(
                "productName"
            )
            .value
            .trim(),


        description:
            document.getElementById(
                "productDescription"
            )
            .value
            .trim(),


        price:
            Number(
                document.getElementById(
                    "productPrice"
                ).value
            ),


        stock:
            Number(
                document.getElementById(
                    "productStock"
                ).value
            ),


        image:
            document.getElementById(
                "productImage"
            )
            .value
            .trim(),


        status:
            document.getElementById(
                "productStatus"
            ).value

    };


    try {

        const url =
            id
            ?
            `${API}/products/${id}`
            :
            `${API}/products`;


        const method =
            id
            ?
            "PUT"
            :
            "POST";


        console.log(
            method,
            url,
            productData
        );


        const data =
            await apiRequest(
                url,
                {
                    method,
                    body:
                        JSON.stringify(
                            productData
                        )
                }
            );


        console.log(
            "Save response:",
            data
        );


        alert(
            id
            ?
            "Product updated successfully."
            :
            "Product added successfully."
        );


        closeModal();


        await loadShop();

    }

    catch (error) {

        console.error(
            "Save product error:",
            error
        );


        alert(
            "Unable to save product:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   TOGGLE PRODUCT STATUS
===================================================== */

async function toggleProduct(
    id
) {

    const product =
        products.find(
            p =>
                String(
                    p.id ??
                    p.product_id
                ) ===
                String(id)
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    const currentStatus =
        product.status ||
        "active";


    const newStatus =
        currentStatus === "active"
        ?
        "inactive"
        :
        "active";


    if (
        !confirm(
            `Change product status to ${newStatus}?`
        )
    ) {

        return;

    }


    try {

        const data =
            await apiRequest(

                `${API}/products/${id}/status`,

                {
                    method: "PUT",

                    body:
                        JSON.stringify({
                            status:
                                newStatus
                        })
                }

            );


        console.log(
            "Status response:",
            data
        );


        alert(
            `Product ${
                newStatus === "active"
                ?
                "activated"
                :
                "disabled"
            } successfully.`
        );


        await loadShop();

    }

    catch (error) {

        console.error(
            "Toggle product error:",
            error
        );


        alert(
            "Unable to change product status:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(
    id
) {

    if (
        !confirm(
            "Are you sure you want to permanently delete this product?"
        )
    ) {

        return;

    }


    try {

        const data =
            await apiRequest(

                `${API}/products/${id}`,

                {
                    method:
                        "DELETE"
                }

            );


        console.log(
            "Delete response:",
            data
        );


        alert(
            "Product deleted successfully."
        );


        await loadShop();

    }

    catch (error) {

        console.error(
            "Delete product error:",
            error
        );


        alert(
            "Unable to delete product:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

document
    .getElementById(
        "productModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );

   START SHOP
===================================================== */
async function loadShop() {

    console.log(
        "==================================="
    );

    console.log(
        "LOADING META EARN SHOP"
    );

    console.log(
        "==================================="
    );


    try {

        // --------------------------------------------
        // LOAD CATEGORIES
        // --------------------------------------------

        await loadCategories();


        // --------------------------------------------
        // LOAD PRODUCTS
        // --------------------------------------------

        await loadProducts();


        // --------------------------------------------
        // LOAD STATISTICS
        // --------------------------------------------

        try {

            await loadStatistics();

        } catch (statisticsError) {

            console.warn(

            );

            updateStatistics();

        }


        console.log(
            "==================================="
        );

        console.log(
            "SHOP LOADED SUCCESSFULLY"
        );

        console.log(
            "==================================="
        );

    } catch (error) {

        console.error(
            "SHOP LOADING ERROR:",
            error
        );

    }

}
loadShop();
