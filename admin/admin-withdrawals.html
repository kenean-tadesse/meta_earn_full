<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Earn Admin - Withdrawal Management</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#07111f;
    color:white;
    padding:25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    font-size:30px;
    font-weight:700;
    color:#38bdf8;
}

.subtitle{
    color:#94a3b8;
    margin-top:6px;
}

.logout-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.logout-btn:hover{
    background:#b91c1c;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:rgba(255,255,255,.05);
    border-radius:18px;
    padding:20px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 20px rgba(37,99,235,.25);
}

.card h3{
    font-size:15px;
    color:#94a3b8;
    margin-bottom:10px;
}

.card h2{
    font-size:32px;
}

.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#111827;
    color:white;
    font-size:15px;
}

.table-container{
    background:rgba(255,255,255,.05);
    border-radius:18px;
    padding:20px;
    overflow:auto;
    box-shadow:0 0 20px rgba(37,99,235,.25);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    padding:15px;
    color:#38bdf8;
    font-size:14px;
    border-bottom:1px solid rgba(255,255,255,.08);
    white-space:nowrap;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.06);
    white-space:nowrap;
}

.pending{
    color:#facc15;
    font-weight:bold;
}

.approved{
    color:#22c55e;
    font-weight:bold;
}

.rejected{
    color:#ef4444;
    font-weight:bold;
}

.approve-btn{
    background:#22c55e;
    color:white;
    padding:9px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    margin-right:5px;
}

.reject-btn{
    background:#ef4444;
    color:white;
    padding:9px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.approve-btn:hover,
.reject-btn:hover{
    opacity:.85;
}

.approve-btn:disabled,
.reject-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.empty{
    text-align:center;
    padding:40px;
    color:#94a3b8;
}

.loading{
    color:#38bdf8;
}

.error{
    color:#ef4444;
}

.success{
    color:#22c55e;
}

.message{
    position:fixed;
    top:20px;
    right:20px;
    min-width:280px;
    max-width:400px;
    padding:16px 20px;
    border-radius:12px;
    display:none;
    z-index:99999;
    font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.message.success-message{
    background:#166534;
    color:white;
}

.message.error-message{
    background:#991b1b;
    color:white;
}

.message.warning-message{
    background:#92400e;
    color:white;
}

@media(max-width:900px){

    body{
        padding:15px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    table{
        font-size:13px;
    }

}

</style>

</head>

<body>

<!-- MESSAGE -->

<div id="messageBox" class="message"></div>


<!-- HEADER -->

<div class="header">

<div>

<h1>
Withdrawal Management
</h1>

<div class="subtitle">
Manage and approve user withdrawal requests
</div>

</div>

<button
class="logout-btn"
onclick="adminLogout()">

Logout

</button>

</div>


<!-- STATS -->

<div class="stats">

<div class="card">

<h3>
Total Withdrawals
</h3>

<h2 id="totalWithdrawals">
0
</h2>

</div>


<div class="card">

<h3>
Pending
</h3>

<h2 id="pendingWithdrawals">
0
</h2>

</div>


<div class="card">

<h3>
Approved
</h3>

<h2 id="approvedWithdrawals">
0
</h2>

</div>


<div class="card">

<h3>
Rejected
</h3>

<h2 id="rejectedWithdrawals">
0
</h2>

</div>

</div>


<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="search"
placeholder="Search by username..."
oninput="searchWithdrawal()">

</div>


<!-- TABLE -->

<div class="table-container">

<table>

<thead>

<tr>

<th>ID</th>

<th>User</th>

<th>Amount</th>

<th>Bank</th>

<th>Account</th>

<th>Status</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>

<tbody id="withdrawTable">

<tr>

<td
colspan="8"
class="empty loading">

Loading withdrawals...

</td>

</tr>

</tbody>

</table>

</div>


<script>

/* =========================================================
   META EARN ADMIN WITHDRAWAL MANAGEMENT
========================================================= */


/* =========================================================
   API
========================================================= */

const API =
"https://meta-earn-14.onrender.com/api";


/* =========================================================
   ADMIN TOKEN
   IMPORTANT:
   DO NOT FALL BACK TO NORMAL USER TOKEN
========================================================= */

let adminToken =
localStorage.getItem("adminToken");


/* =========================================================
   CHECK ADMIN LOGIN
========================================================= */

if(!adminToken){

    alert(
        "Admin login required. Please login again."
    );

    window.location.href =
        "admin-login.html";

}


/* =========================================================
   DATA
========================================================= */

let allWithdrawals = [];

let loadingAction = false;


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(
    text,
    type = "success",
    duration = 5000
){

    const box =
        document.getElementById("messageBox");

    box.innerText = text;

    box.className =
        "message";

    if(type === "success"){

        box.classList.add(
            "success-message"
        );

    }

    else if(type === "error"){

        box.classList.add(
            "error-message"
        );

    }

    else{

        box.classList.add(
            "warning-message"
        );

    }

    box.style.display = "block";


    clearTimeout(messageTimer);


    messageTimer =
        setTimeout(() => {

            box.style.display =
                "none";

        }, duration);

}


/* =========================================================
   HANDLE 401
========================================================= */

function handleUnauthorized(){

    localStorage.removeItem(
        "adminToken"
    );

    showMessage(
        "Admin session expired. Please login again.",
        "error",
        4000
    );

    setTimeout(() => {

        window.location.href =
            "admin-login.html";

    }, 1500);

}


/* =========================================================
   LOAD WITHDRAWALS
========================================================= */

async function loadWithdrawals(){

    adminToken =
        localStorage.getItem(
            "adminToken"
        );


    if(!adminToken){

        handleUnauthorized();

        return;

    }


    try{

        const response =
            await fetch(
                `${API}/withdrawals`,
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            `Bearer ${adminToken}`,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        /* =========================
           401
        ========================= */

        if(response.status === 401){

            handleUnauthorized();

            return;

        }


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to load withdrawals"
            );

        }


        if(!data.success){

            throw new Error(
                data.message ||
                "Failed to load withdrawals"
            );

        }


        allWithdrawals =
            Array.isArray(data.withdrawals)
                ? data.withdrawals
                : [];


        updateStats();


        displayWithdrawals(
            allWithdrawals
        );


    }

    catch(error){

        console.error(
            "LOAD WITHDRAWALS ERROR:",
            error
        );


        document.getElementById(
            "withdrawTable"
        ).innerHTML = `

        <tr>

        <td
        colspan="8"
        class="empty error">

        ${escapeHtml(
            error.message ||
            "Server connection failed."
        )}

        </td>

        </tr>

        `;

    }

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(){

    const total =
        allWithdrawals.length;


    const pending =
        allWithdrawals.filter(
            item =>
                String(item.status)
                .toLowerCase()
                === "pending"
        ).length;


    const approved =
        allWithdrawals.filter(
            item =>
                String(item.status)
                .toLowerCase()
                === "approved"
        ).length;


    const rejected =
        allWithdrawals.filter(
            item =>
                String(item.status)
                .toLowerCase()
                === "rejected"
        ).length;


    document.getElementById(
        "totalWithdrawals"
    ).innerText = total;


    document.getElementById(
        "pendingWithdrawals"
    ).innerText = pending;


    document.getElementById(
        "approvedWithdrawals"
    ).innerText = approved;


    document.getElementById(
        "rejectedWithdrawals"
    ).innerText = rejected;

}


/* =========================================================
   DISPLAY WITHDRAWALS
========================================================= */

function displayWithdrawals(list){

    const table =
        document.getElementById(
            "withdrawTable"
        );


    table.innerHTML = "";


    if(!list.length){

        table.innerHTML = `

        <tr>

        <td
        colspan="8"
        class="empty">

        No withdrawal requests found.

        </td>

        </tr>

        `;

        return;

    }


    list.forEach(item => {

        const status =
            String(item.status || "")
            .toLowerCase();


        let action = "";


        if(status === "pending"){

            action = `

            <button
            class="approve-btn"
            onclick="approveWithdrawal(${Number(item.id)})">

            Approve

            </button>


            <button
            class="reject-btn"
            onclick="rejectWithdrawal(${Number(item.id)})">

            Reject

            </button>

            `;

        }

        else{

            action = "Completed";

        }


        const username =
            item.username ||
            item.user_name ||
            "Unknown";


        const bank =
            item.bank_name ||
            "-";


        const account =
            item.bank_account ||
            item.account_number ||
            "-";


        const amount =
            Number(item.amount || 0)
            .toFixed(2);


        let date = "-";


        if(item.created_at){

            const d =
                new Date(
                    item.created_at
                );

            if(!isNaN(d.getTime())){

                date =
                    d.toLocaleString();

            }

        }


        table.innerHTML += `

        <tr>

        <td>
        ${Number(item.id)}
        </td>


        <td>
        ${escapeHtml(username)}
        </td>


        <td>
        ${amount} Birr
        </td>


        <td>
        ${escapeHtml(bank)}
        </td>


        <td>
        ${escapeHtml(account)}
        </td>


        <td class="${status}">
        ${escapeHtml(
            status.toUpperCase()
        )}
        </td>


        <td>
        ${escapeHtml(date)}
        </td>


        <td>
        ${action}
        </td>

        </tr>

        `;

    });

}


/* =========================================================
   SEARCH
========================================================= */

function searchWithdrawal(){

    const text =
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
        allWithdrawals.filter(item => {

            const username =
                String(
                    item.username ||
                    item.user_name ||
                    ""
                )
                .toLowerCase();


            return username.includes(
                text
            );

        });


    displayWithdrawals(
        filtered
    );

}


/* =========================================================
   APPROVE WITHDRAWAL
========================================================= */

async function approveWithdrawal(id){

    if(loadingAction){

        return;

    }


    const confirmed =
        confirm(
            `Approve withdrawal #${id}?\n\n` +
            `The user's withdrawal will be marked as approved.`
        );


    if(!confirmed){

        return;

    }


    adminToken =
        localStorage.getItem(
            "adminToken"
        );


    if(!adminToken){

        handleUnauthorized();

        return;

    }


    loadingAction = true;


    try{

        showMessage(
            "Processing withdrawal approval...",
            "warning",
            10000
        );


        const response =
            await fetch(

                `${API}/withdrawals/approve/${id}`,

                {

                    method:"PUT",

                    headers:{

                        "Authorization":
                            `Bearer ${adminToken}`,

                        "Content-Type":
                            "application/json"

                    }

                }

            );


        /* =========================
           IMPORTANT 401 CHECK
        ========================= */

        if(response.status === 401){

            handleUnauthorized();

            return;

        }


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                `Approval failed (${response.status})`
            );

        }


        if(!data.success){

            throw new Error(
                data.message ||
                "Withdrawal approval failed."
            );

        }


        showMessage(

            data.message ||
            "Withdrawal approved successfully.",

            "success",

            5000

        );


        await loadWithdrawals();


    }

    catch(error){

        console.error(
            "APPROVE ERROR:",
            error
        );


        showMessage(

            error.message ||
            "Failed to approve withdrawal.",

            "error",

            6000

        );

    }

    finally{

        loadingAction = false;

    }

}


/* =========================================================
   REJECT WITHDRAWAL
========================================================= */

async function rejectWithdrawal(id){

    if(loadingAction){

        return;

    }


    const confirmed =
        confirm(
            `Reject withdrawal #${id}?`
        );


    if(!confirmed){

        return;

    }


    adminToken =
        localStorage.getItem(
            "adminToken"
        );


    if(!adminToken){

        handleUnauthorized();

        return;

    }


    loadingAction = true;


    try{

        showMessage(
            "Processing withdrawal rejection...",
            "warning",
            10000
        );


        const response =
            await fetch(

                `${API}/withdrawals/reject/${id}`,

                {

                    method:"PUT",

                    headers:{

                        "Authorization":
                            `Bearer ${adminToken}`,

                        "Content-Type":
                            "application/json"

                    }

                }

            );


        if(response.status === 401){

            handleUnauthorized();

            return;

        }


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                `Rejection failed (${response.status})`
            );

        }


        if(!data.success){

            throw new Error(
                data.message ||
                "Withdrawal rejection failed."
            );

        }


        showMessage(

            data.message ||
            "Withdrawal rejected successfully.",

            "success",

            5000

        );


        await loadWithdrawals();


    }

    catch(error){

        console.error(
            "REJECT ERROR:",
            error
        );


        showMessage(

            error.message ||
            "Failed to reject withdrawal.",

            "error",

            6000

        );

    }

    finally{

        loadingAction = false;

    }

}


/* =========================================================
   LOGOUT
========================================================= */

function adminLogout(){

    localStorage.removeItem(
        "adminToken"
    );

    window.location.href =
        "admin-login.html";

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadWithdrawals();


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
    loadWithdrawals,
    10000
);

</script>

</body>

</html>
