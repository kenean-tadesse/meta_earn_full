<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Meta-Earn Login</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #10243d,
            #07111f 55%,
            #030812
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    color: white;
}


/* =========================================================
   PROFESSIONAL PRELOADER
========================================================= */

#preloader {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #10233b 0%,
            #081220 45%,
            #030812 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    z-index: 999999;

    opacity: 1;

    visibility: visible;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}


/* Hide loader */

#preloader.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* =========================================================
   META-EARN LOGO
========================================================= */

.loader-logo {

    width: 75px;

    height: 75px;

    border-radius: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 25px;

    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #2563eb
        );

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 1px;

    box-shadow:
        0 10px 40px
        rgba(6, 182, 212, 0.35);

    animation:
        logoPulse 2s ease-in-out infinite;
}


/* =========================================================
   ROTATING LOADER
========================================================= */

.loader-wrapper {

    position: relative;

    width: 90px;

    height: 90px;

    margin-bottom: 25px;
}


/* Outer ring */

.loader-ring {

    position: absolute;

    inset: 0;

    border:

        4px solid
        rgba(255,255,255,0.10);

    border-top-color: #06b6d4;

    border-right-color: #2563eb;

    border-radius: 50%;

    animation:
        rotate 1s linear infinite;
}


/* Middle ring */

.loader-ring-two {

    position: absolute;

    inset: 12px;

    border:

        3px solid
        rgba(255,255,255,0.08);

    border-bottom-color: #22c55e;

    border-left-color: #06b6d4;

    border-radius: 50%;

    animation:
        rotateReverse 1.5s linear infinite;
}


/* Inner ring */

.loader-ring-three {

    position: absolute;

    inset: 25px;

    border:

        2px solid
        rgba(255,255,255,0.08);

    border-top-color: white;

    border-radius: 50%;

    animation:
        rotate 1.8s linear infinite;
}


/* Center */

.loader-center {

    position: absolute;

    width: 12px;

    height: 12px;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 15px
        #06b6d4;

    animation:
        pulse 1s ease-in-out infinite;
}


/* =========================================================
   LOADER TEXT
========================================================= */

.loader-title {

    font-size: 27px;

    font-weight: 900;

    letter-spacing: 3px;

    margin-bottom: 8px;
}


.loader-subtitle {

    font-size: 12px;

    color:
        rgba(255,255,255,0.55);

    letter-spacing: 2px;

    margin-bottom: 25px;
}


.loader-status {

    font-size: 14px;

    color:
        rgba(255,255,255,0.85);

    margin-bottom: 15px;
}


/* =========================================================
   LOADING DOTS
========================================================= */

.loading-dots span {

    opacity: 0.2;

    animation:
        dots 1.4s infinite;
}


.loading-dots span:nth-child(2) {

    animation-delay:
        0.2s;
}


.loading-dots span:nth-child(3) {

    animation-delay:
        0.4s;
}


/* =========================================================
   PROGRESS BAR
========================================================= */

.loader-progress {

    width: 260px;

    max-width: 80vw;

    height: 5px;

    background:
        rgba(255,255,255,0.10);

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 10px;
}


.loader-progress-bar {

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #06b6d4,
            #2563eb,
            #22c55e
        );

    transition:
        width 0.1s linear;
}


.loader-percent {

    font-size: 11px;

    color:
        rgba(255,255,255,0.45);

    letter-spacing: 1px;
}


/* =========================================================
   LOGIN CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 450px;

    background:
        rgba(255,255,255,0.05);

    padding: 25px;

    border-radius: 25px;

    color: white;

    border:
        1px solid
        rgba(255,255,255,0.08);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.35);

    backdrop-filter:
        blur(15px);
}


/* =========================================================
   TITLE
========================================================= */

h1 {

    text-align: center;

    margin-bottom: 20px;

    letter-spacing: 1px;
}


/* =========================================================
   TABS
========================================================= */

.tabs {

    display: flex;

    margin-bottom: 20px;

    gap: 5px;
}


.tabs button {

    flex: 1;

    padding: 15px;

    border: none;

    cursor: pointer;

    font-weight: bold;

    border-radius: 10px;

    background:
        #1e293b;

    color:
        #94a3b8;

    transition:
        0.3s;
}


.tabs button.active {

    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #2563eb
        );

    color: white;

    box-shadow:
        0 8px 20px
        rgba(6,182,212,0.2);
}


/* =========================================================
   FORMS
========================================================= */

.form {

    display: none;
}


.active-form {

    display: block;

    animation:
        formAppear 0.3s ease;
}


/* =========================================================
   INPUT
========================================================= */

input {

    width: 100%;

    padding: 15px;

    margin-bottom: 15px;

    border:

        1px solid
        rgba(255,255,255,0.05);

    border-radius: 12px;

    background:
        #1e293b;

    color: white;

    outline: none;

    transition:
        0.3s;
}


input:focus {

    border-color:
        #06b6d4;

    box-shadow:
        0 0 0 3px
        rgba(6,182,212,0.10);
}


input::placeholder {

    color:
        #64748b;
}


/* =========================================================
   BUTTON
========================================================= */

.submit-btn {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #2563eb
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition:
        0.3s;
}


.submit-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(6,182,212,0.25);
}


.submit-btn:active {

    transform:
        translateY(0);
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    text-align: center;

    margin-top: 15px;

    color: white;

    min-height: 20px;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes rotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


@keyframes pulse {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.7);

        opacity: 0.6;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.3);

        opacity: 1;
    }
}


@keyframes logoPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}


@keyframes dots {

    0% {
        opacity: 0.2;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.2;
    }
}


@keyframes formAppear {

    from {

        opacity: 0;

        transform:
            translateY(10px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 500px) {

    .container {

        padding: 20px;

        border-radius: 20px;
    }

    .loader-title {

        font-size: 23px;
    }

    .loader-wrapper {

        width: 75px;

        height: 75px;
    }

}

/* =========================================================
   LOGIN / REGISTER BUTTON LOADING SPINNER
========================================================= */

.button-content {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;
}


/* Rotating spinner */

.button-spinner {

    display: none;

    width: 17px;

    height: 17px;

    border: 3px solid
        rgba(255,255,255,0.35);

    border-top-color: white;

    border-radius: 50%;

    animation:
        buttonSpin 0.7s linear infinite;
}


/* Show spinner */

.button-spinner.active {

    display: inline-block;
}


/* Disabled button */

.submit-btn.loading {

    opacity: 0.75;

    cursor: not-allowed;

    transform: none !important;
}


/* Animation */

@keyframes buttonSpin {

    from {

        transform:
            rotate(0deg);
    }

    to {

        transform:
            rotate(360deg);
    }
}

</style>

</head>


<body>


<!-- =========================================================
     PROFESSIONAL PRELOADER
========================================================= -->

<div id="preloader">

    <div class="loader-logo">
        ME
    </div>


    <div class="loader-wrapper">

        <div class="loader-ring"></div>

        <div class="loader-ring-two"></div>

        <div class="loader-ring-three"></div>

        <div class="loader-center"></div>

    </div>


    <div class="loader-title">
        Meta-Earn
    </div>


    <div class="loader-subtitle">
        SMART EARNING PLATFORM
    </div>


    <div
        id="loaderStatus"
        class="loader-status"
    >

        Initializing system

        <span class="loading-dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </span>

    </div>


    <div class="loader-progress">

        <div
            id="loaderProgress"
            class="loader-progress-bar"
        ></div>

    </div>


    <div
        id="loaderPercent"
        class="loader-percent"
    >
        0%
    </div>

</div>


<!-- =========================================================
     LOGIN / REGISTER
========================================================= -->

<div class="container">

    <h1>
        Meta-Earn
    </h1>


    <div class="tabs">

        <button
            id="loginTab"
            class="active"
        >
            Login
        </button>

        <button
            id="registerTab"
        >
            Register
        </button>

    </div>


    <!-- LOGIN -->

    <div
        id="loginForm"
        class="form active-form"
    >

        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
        >

        <input
            type="text"
            id="loginphone"
            placeholder="Phone Number"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >


      <button
    id="loginButton"
    class="submit-btn"
    onclick="loginUser()"
>
    <span class="button-content">
        <span id="loginSpinner" class="button-spinner"></span>
        <span id="loginButtonText">Login</span>
    </span>
</button>

    </div>


    <!-- REGISTER -->

    <div
        id="registerForm"
        class="form"
    >

        <input
            type="text"
            id="registerUsername"
            placeholder="Username"
        >

        <input
            type="text"
            id="registerfullname"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
        >

        <input
            type="tel"
            id="registerphone"
            placeholder="Phone Number"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >


       <button
    id="registerButton"
    class="submit-btn"
    onclick="registerUser()"
>
    <span class="button-content">
        <span id="registerSpinner" class="button-spinner"></span>
        <span id="registerButtonText">Register</span>
    </span>
</button>

    </div>


    <div
        id="message"
        class="message"
    ></div>

</div>


<script>

/* =========================================================
   API
========================================================= */

const API =
    "https://meta-earn-14.onrender.com";


/* =========================================================
   PRELOADER
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const preloader =
            document.getElementById(
                "preloader"
            );

        const progress =
            document.getElementById(
                "loaderProgress"
            );

        const percent =
            document.getElementById(
                "loaderPercent"
            );

        const status =
            document.getElementById(
                "loaderStatus"
            );


        const messages = [

            "Initializing system",

            "Loading platform",

            "Connecting to server",

            "Checking services",

            "Preparing account system",

            "System ready"

        ];


        let value = 0;

        let messageIndex = 0;


        /* ---------------------------------------------
           Progress
        --------------------------------------------- */

        const progressTimer =
            setInterval(
                function () {

                    value += 2;

                    if (value >= 100) {

                        value = 100;

                        clearInterval(
                            progressTimer
                        );
                    }


                    progress.style.width =
                        value + "%";


                    percent.textContent =
                        value + "%";


                    if (
                        value % 18 === 0 &&
                        messageIndex <
                        messages.length - 1
                    ) {

                        messageIndex++;

                        status.innerHTML =
                            messages[
                                messageIndex
                            ] +

                            `
                            <span
                                class="loading-dots"
                            >
                                <span>.</span>
                                <span>.</span>
                                <span>.</span>
                            </span>
                            `;
                    }

                },
                40
            );


        /* ---------------------------------------------
           Hide after browser finishes loading
        --------------------------------------------- */

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        progress.style.width =
                            "100%";

                        percent.textContent =
                            "100%";

                        status.textContent =
                            "System ready";


                        setTimeout(
                            function () {

                                preloader.classList.add(
                                    "hidden"
                                );

                            },
                            400
                        );

                    },
                    300
                );

            }
        );

    }
);


/* =========================================================
   TAB SWITCHING
========================================================= */

const loginTab =
    document.getElementById(
        "loginTab"
    );

const registerTab =
    document.getElementById(
        "registerTab"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const registerForm =
    document.getElementById(
        "registerForm"
    );


loginTab.onclick = function () {

    loginTab.classList.add(
        "active"
    );

    registerTab.classList.remove(
        "active"
    );

    loginForm.classList.add(
        "active-form"
    );

    registerForm.classList.remove(
        "active-form"
    );

    document.getElementById(
        "message"
    ).innerHTML = "";

};


registerTab.onclick = function () {

    registerTab.classList.add(
        "active"
    );

    loginTab.classList.remove(
        "active"
    );

    registerForm.classList.add(
        "active-form"
    );

    loginForm.classList.remove(
        "active-form"
    );

    document.getElementById(
        "message"
    ).innerHTML = "";

};


/* =========================================================
   LOGIN
========================================================= */

async function loginUser() {

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginButton");

    const spinner =
        document.getElementById("loginSpinner");

    const buttonText =
        document.getElementById("loginButtonText");


    const username =
        document.getElementById(
            "loginUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const phone =
        document.getElementById(
            "loginphone"
        ).value.trim();


    /* ---------------------------------------------
       Validation
    --------------------------------------------- */

    if (!username || !password) {

        message.innerHTML =
            "Please enter username and password.";

        return;
    }


    /* ---------------------------------------------
       START LOADING
    --------------------------------------------- */

    button.disabled = true;

    button.classList.add("loading");

    spinner.classList.add("active");

    buttonText.textContent =
        "Logging in...";

    message.innerHTML =
        "Please wait...";


    try {

        const response =
            await fetch(
                API + "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            password:
                                password

                        })
                }
            );


        const data =
            await response.json();


        console.log(
            "Login response:",
            data
        );


        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        if (data.success) {

            buttonText.textContent =
                "Success ✓";


            message.innerHTML =
                "Login successful. Redirecting...";


            localStorage.setItem(
                "token",
                data.token
            );


            localStorage.setItem(
                "userId",
                data.user.id
            );


            localStorage.setItem(
                "user",
                JSON.stringify(
                    data.user
                )
            );


            setTimeout(
                function () {

                    window.location.href =
                        "terminal.html";

                },
                500
            );


            return;
        }


        /* -----------------------------------------
           LOGIN FAILED
        ----------------------------------------- */

        spinner.classList.remove(
            "active"
        );

        button.disabled = false;

        button.classList.remove(
            "loading"
        );

        buttonText.textContent =
            "Login";


        message.innerHTML =
            data.message ||
            "Login failed.";


    } catch (error) {

        console.error(
            "Login error:",
            error
        );


        /* Stop spinner */

        spinner.classList.remove(
            "active"
        );


        button.disabled = false;

        button.classList.remove(
            "loading"
        );


        buttonText.textContent =
            "Login";


        message.innerHTML =
            "Cannot connect to server.";

    }

}


/* =========================================================
   REGISTER
========================================================= */

async function registerUser() {

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("registerButton");

    const spinner =
        document.getElementById("registerSpinner");

    const buttonText =
        document.getElementById(
            "registerButtonText"
        );


    try {

        const fullname =
            document.getElementById(
                "registerfullname"
            ).value.trim();


        const username =
            document.getElementById(
                "registerUsername"
            ).value.trim();


        const email =
            document.getElementById(
                "registerEmail"
            ).value.trim();


        const phone =
            document.getElementById(
                "registerphone"
            ).value.trim();


        const password =
            document.getElementById(
                "registerPassword"
            ).value.trim();


        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const referral_code =
            urlParams.get("ref") || "";


        /* -----------------------------------------
           VALIDATION
        ----------------------------------------- */

        if (
            !fullname ||
            !username ||
            !email ||
            !phone ||
            !password
        ) {

            message.innerHTML =
                "Please fill all fields.";

            return;
        }


        /* -----------------------------------------
           START LOADING
        ----------------------------------------- */

        button.disabled = true;

        button.classList.add(
            "loading"
        );

        spinner.classList.add(
            "active"
        );

        buttonText.textContent =
            "Creating account...";


        message.innerHTML =
            "Please wait...";


        /* -----------------------------------------
           API REQUEST
        ----------------------------------------- */

        const response =
            await fetch(
                API +
                "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            fullname,

                            username,

                            email,

                            phone,

                            password,

                            referral_code

                        })
                }
            );


        const data =
            await response.json();


        console.log(
            "Register response:",
            data
        );


        /* -----------------------------------------
           REGISTRATION FAILED
        ----------------------------------------- */

        if (!response.ok) {

            spinner.classList.remove(
                "active"
            );

            button.disabled = false;

            button.classList.remove(
                "loading"
            );

            buttonText.textContent =
                "Register";


            message.innerHTML =
                data.message ||
                "Registration failed.";

            return;
        }


        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        spinner.classList.remove(
            "active"
        );


        buttonText.textContent =
            "Account Created ✓";


        message.innerHTML =
            "Registration successful. Please login.";


        /* Clear form */

        document.getElementById(
            "registerfullname"
        ).value = "";


        document.getElementById(
            "registerUsername"
        ).value = "";


        document.getElementById(
            "registerEmail"
        ).value = "";


        document.getElementById(
            "registerphone"
        ).value = "";


        document.getElementById(
            "registerPassword"
        ).value = "";


        /* Enable button */

        button.disabled = false;

        button.classList.remove(
            "loading"
        );


        /* Switch to login */

        setTimeout(
            function () {

                loginTab.click();

                buttonText.textContent =
                    "Register";

            },
            1000
        );


    } catch (error) {

        console.error(
            "Register Error:",
            error
        );


        /* Stop spinner */

        spinner.classList.remove(
            "active"
        );


        button.disabled = false;

        button.classList.remove(
            "loading"
        );


        buttonText.textContent =
            "Register";


        message.innerHTML =
            "Cannot connect to server.";

    }

}

</script>


</body>
</html>
