<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Earn | VIP Level 2</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter, sans-serif;
}

body {
    background: #081120;
    color: #fff;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at top left, #4f46e5 0%, transparent 35%),
        radial-gradient(circle at bottom right, #06b6d4 0%, transparent 35%);
    z-index: -1;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 34px;
    font-weight: 800;
    background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.vipText {
    margin-top: 5px;
    color: #cbd5e1;
    font-weight: 600;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: rgba(255, 255, 255, .08);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    padding: 25px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, .1);
}

.title {
    opacity: .7;
    font-size: 14px;
    margin-bottom: 10px;
}

.value {
    font-size: 30px;
    font-weight: bold;
}

.green {
    color: #22c55e;
}

.orange {
    color: #f59e0b;
}

.blue {
    color: #38bdf8;
}

.purple {
    color: #a78bfa;
}

.progressBox {
    background: rgba(255, 255, 255, .08);
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 30px;
}

.progressBox h2 {
    margin-bottom: 5px;
}

.progress {
    height: 18px;
    background: #1e293b;
    border-radius: 30px;
    overflow: hidden;
    margin-top: 15px;
}

.progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #06b6d4);
    transition: width .5s ease;
}

.progressText {
    margin-top: 10px;
    color: #cbd5e1;
    font-size: 14px;
}

.sectionTitle {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 20px;
}

.taskList {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
}

.task {
    background: rgba(255, 255, 255, .08);
    padding: 20px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, .1);
    transition: .3s;
}

.task:hover {
    transform: translateY(-5px);
}

.task h3 {
    margin-bottom: 10px;
}

.task p {
    opacity: .7;
    margin-bottom: 20px;
    line-height: 1.5;
}

.reward {
    color: #22c55e;
    font-weight: bold;
    margin-bottom: 15px;
}

.task button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(90deg, #6366f1, #06b6d4);
    color: white;
    transition: .2s;
}

.task button:hover:not(:disabled) {
    opacity: .9;
    transform: translateY(-1px);
}

.task button:disabled {
    cursor: not-allowed;
    opacity: .7;
}

.completedButton {
    background: #16a34a !important;
}

.footer {
    text-align: center;
    margin-top: 50px;
    padding-bottom: 25px;
    opacity: .6;
}

.logoutBtn {
    background: #dc2626;
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.logoutBtn:hover {
    background: #b91c1c;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    color: #fff;
    text-decoration: none;
    font-size: 26px;
    font-weight: bold;
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
    cursor: pointer;
    z-index: 9999;
    border: none;
    outline: none;
    transition: .25s;
}

.back-button:hover {
    background: linear-gradient(135deg, #1d4ed8, #0891b2);
    box-shadow: 0 12px 25px rgba(0, 0, 0, .35);
}

.back-button:active {
    transform: scale(.96);
}

.loading {
    text-align: center;
    padding: 30px;
    color: #cbd5e1;
}

.errorBox {
    background: rgba(220, 38, 38, .15);
    border: 1px solid rgba(248, 113, 113, .4);
    padding: 20px;
    border-radius: 15px;
    color: #fecaca;
    text-align: center;
}

.emptyBox {
    background: rgba(255, 255, 255, .06);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    color: #cbd5e1;
}

@media (max-width: 600px) {

    .container {
        padding: 15px;
        padding-top: 85px;
    }

    .logo {
        font-size: 28px;
    }

    .sectionTitle {
        font-size: 24px;
    }

    .taskList {
        grid-template-columns: 1fr;
    }

    .back-button {
        top: 15px;
        left: 15px;
    }
}

</style>

</head>

<body>

<button
    class="back-button"
    onclick="goBack()"
    title="Back"
    aria-label="Go back"
>
    ←
</button>

<div class="container">

    <div class="header">

        <div>

            <div class="logo">
                META EARN
            </div>

            <div class="vipText" id="vipText">
                VIP Level 2
            </div>

        </div>

        <button
            class="logoutBtn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- SUMMARY CARDS -->

    <div class="cards">

        <div class="card">

            <div class="title">
                Wallet Balance
            </div>

            <div class="value green">
                <span id="balance">0.00</span> ETB
            </div>

        </div>


        <div class="card">

            <div class="title">
                VIP Level
            </div>

            <div
                class="value blue"
                id="vipLevel"
            >
                2
            </div>

        </div>


        <div class="card">

            <div class="title">
                Completed Today
            </div>

            <div class="value purple">
                <span id="completedCount">0</span>
            </div>

        </div>


        <div class="card">

            <div class="title">
                Available Tasks
            </div>

            <div class="value orange">
                <span id="taskCount">0</span>
            </div>

        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progressBox">

        <h2>
            Today's Progress
        </h2>

        <div class="progress">

            <div
                class="progressFill"
                id="progressFill"
            ></div>

        </div>

        <div
            class="progressText"
            id="progressText"
        >
            0 of 0 tasks completed
        </div>

    </div>


    <!-- TASKS -->

    <h2 class="sectionTitle">
        VIP 2 Tasks
    </h2>

    <div
        class="taskList"
        id="taskContainer"
    >

        <div class="loading">
            Loading tasks...
        </div>

    </div>


    <div class="footer">
        © 2026 Meta Earn
    </div>

</div>


<script>

/*
=========================================================
META EARN LEVEL 2
PRODUCTION API CONFIGURATION
=========================================================
*/

/*
 IMPORTANT:

 Your deployed backend is:

 https://meta-earn-14.onrender.com

 Your API prefix is:

 /api

 Therefore:

 /api/auth/profile
 /api/tasks
 /api/tasks/complete/:id
*/

const API = "https://meta-earn-14.onrender.com/api";


/*
=========================================================
AUTH TOKEN
=========================================================
*/

let token = localStorage.getItem("token");


/*
=========================================================
APPLICATION STATE
=========================================================
*/

let completed = 0;
let totalTasks = 0;
let wallet = 0;
let vip = 2;


/*
=========================================================
CHECK LOGIN
=========================================================
*/

function checkAuthentication() {

    token = localStorage.getItem("token");

    if (!token) {

        window.location.href = "login.html";

        return false;
    }

    return true;
}


/*
=========================================================
SAFE JSON RESPONSE
=========================================================
*/

async function getJsonResponse(response) {

    const contentType =
        response.headers.get("content-type") || "";

    if (contentType.includes("application/json")) {

        return await response.json();

    }

    const text = await response.text();

    throw new Error(
        "Server returned non-JSON response: " +
        text.substring(0, 200)
    );
}


/*
=========================================================
LOAD USER PROFILE
=========================================================
*/

async function loadProfile() {

    if (!checkAuthentication()) {
        return false;
    }

    try {

        const response = await fetch(
            API + "/auth/profile",
            {
                method: "GET",

                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },

                cache: "no-store"
            }
        );


        /*
        ================================================
        UNAUTHORIZED
        ================================================
        */

        if (response.status === 401) {

            console.warn(
                "Authentication token is invalid or expired."
            );

            localStorage.removeItem("token");

            window.location.href = "login.html";

            return false;
        }


        /*
        ================================================
        SERVER ERROR
        ================================================
        */

        if (!response.ok) {

            throw new Error(
                "Profile request failed. HTTP " +
                response.status
            );
        }


        const data = await getJsonResponse(response);


        /*
        ================================================
        CHECK API RESPONSE
        ================================================
        */

        if (!data || data.success !== true) {

            console.error(
                "Profile API response:",
                data
            );

            localStorage.removeItem("token");

            window.location.href = "login.html";

            return false;
        }


        /*
        ================================================
        USER DATA
        ================================================
        */

        if (!data.user) {

            throw new Error(
                "Profile response does not contain user data."
            );
        }


        const user = data.user;


        /*
        ================================================
        BALANCE
        ================================================
        */

        wallet = Number(
            user.balance ?? 0
        );


        /*
        ================================================
        VIP LEVEL
        ================================================
        */

        vip = Number(
            user.vip_level ??
            user.level ??
            2
        );


        /*
        ================================================
        DISPLAY PROFILE
        ================================================
        */

        document.getElementById(
            "balance"
        ).textContent = wallet.toFixed(2);


        document.getElementById(
            "vipLevel"
        ).textContent = vip;


        document.getElementById(
            "vipText"
        ).textContent =
            "VIP Level " + vip;


        return true;

    }
    catch (error) {

        console.error(
            "Profile loading error:",
            error
        );


        /*
        ================================================
        DO NOT LEAVE AN UNCAUGHT PROMISE ERROR
        ================================================
        */

        const container =
            document.getElementById("taskContainer");

        container.innerHTML = `
            <div class="errorBox">
                Unable to load your profile.
                <br><br>
                Please check your internet connection
                and try again.
            </div>
        `;

        return false;
    }
}


/*
=========================================================
LOAD TASKS
=========================================================
*/

async function loadTasks() {

    if (!checkAuthentication()) {
        return;
    }

    const container =
        document.getElementById("taskContainer");


    container.innerHTML = `
        <div class="loading">
            Loading tasks...
        </div>
    `;


    try {

        const response = await fetch(
            API + "/tasks",
            {
                method: "GET",

                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },

                cache: "no-store"
            }
        );


        /*
        ================================================
        UNAUTHORIZED
        ================================================
        */

        if (response.status === 401) {

            localStorage.removeItem("token");

            window.location.href = "login.html";

            return;
        }


        if (!response.ok) {

            throw new Error(
                "Tasks request failed. HTTP " +
                response.status
            );
        }


        const data =
            await getJsonResponse(response);


        if (!data || data.success !== true) {

            container.innerHTML = `
                <div class="errorBox">
                    ${
                        data?.message ||
                        "Unable to load tasks."
                    }
                </div>
            `;

            return;
        }


        /*
        ================================================
        TASK ARRAY
        ================================================
        */

        const tasks =
            Array.isArray(data.tasks)
                ? data.tasks
                : [];


        totalTasks = tasks.length;


        document.getElementById(
            "taskCount"
        ).textContent = totalTasks;


        container.innerHTML = "";


        /*
        ================================================
        NO TASKS
        ================================================
        */

        if (tasks.length === 0) {

            container.innerHTML = `
                <div class="emptyBox">
                    No tasks are currently available.
                </div>
            `;

            completed = 0;

            updateProgress();

            return;
        }


        /*
        ================================================
        DISPLAY TASKS
        ================================================
        */

        tasks.forEach(task => {

            const card =
                document.createElement("div");

            card.className = "task";


            const title =
                escapeHtml(
                    task.title ??
                    "Task"
                );


            const description =
                escapeHtml(
                    task.description ??
                    "Complete this task."
                );


            const commission =
                Number(
                    task.commission ??
                    task.reward ??
                    0
                );


            const taskId =
                task.id ??
                task.task_id;


            card.innerHTML = `

                <h3>
                    ${title}
                </h3>

                <p>
                    ${description}
                </p>

                <div class="reward">
                    Reward:
                    ${commission.toFixed(2)}
                    ETB
                </div>

                <button
                    type="button"
                    data-task-id="${taskId}"
                >
                    Complete Task
                </button>

            `;


            const button =
                card.querySelector("button");


            button.addEventListener(
                "click",
                function () {

                    completeTask(
                        taskId,
                        button
                    );

                }
            );


            container.appendChild(card);

        });


        /*
        ================================================
        INITIAL PROGRESS
        ================================================
        */

        updateProgress();

    }
    catch (error) {

        console.error(
            "Tasks loading error:",
            error
        );


        container.innerHTML = `
            <div class="errorBox">
                Unable to connect to the task server.
                <br><br>
                Please refresh the page and try again.
            </div>
        `;

    }

}


/*
=========================================================
COMPLETE TASK
=========================================================
*/

async function completeTask(
    taskId,
    button
) {

    if (!checkAuthentication()) {
        return;
    }


    if (!taskId) {

        alert(
            "Invalid task ID."
        );

        return;
    }


    /*
    ================================================
    PREVENT DOUBLE CLICK
    ================================================
    */

    button.disabled = true;

    button.textContent =
        "Processing...";


    try {

        const response = await fetch(
            API +
            "/tasks/complete/" +
            encodeURIComponent(taskId),
            {
                method: "POST",

                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                }
            }
        );


        /*
        ================================================
        AUTH ERROR
        ================================================
        */

        if (response.status === 401) {

            localStorage.removeItem("token");

            window.location.href =
                "login.html";

            return;
        }


        const data =
            await getJsonResponse(response);


        /*
        ================================================
        TASK FAILED
        ================================================
        */

        if (!response.ok || data.success !== true) {

            alert(
                data?.message ||
                "Unable to complete this task."
            );

            button.disabled = false;

            button.textContent =
                "Complete Task";

            return;
        }


        /*
        ================================================
        TASK SUCCESS
        ================================================
        */

        button.textContent =
            "✔ Completed";

        button.classList.add(
            "completedButton"
        );

        button.disabled = true;


        /*
        ================================================
        UPDATE BALANCE
        ================================================
        */

        if (
            data.balance !== undefined &&
            data.balance !== null
        ) {

            wallet =
                Number(data.balance);

        }
        else {

            /*
            If backend doesn't return balance,
            reload profile.
            */

            await loadProfile();

        }


        document.getElementById(
            "balance"
        ).textContent =
            Number(wallet).toFixed(2);


        /*
        ================================================
        UPDATE COMPLETED COUNT
        ================================================
        */

        completed++;

        document.getElementById(
            "completedCount"
        ).textContent =
            completed;


        updateProgress();


        /*
        ================================================
        SUCCESS MESSAGE
        ================================================
        */

        const reward =
            Number(
                data.reward ??
                data.commission ??
                0
            );


        alert(
            "Congratulations!\n\n" +
            (
                data.message ||
                "Task completed successfully."
            ) +
            "\n\nReward: " +
            reward.toFixed(2) +
            " ETB"
        );

    }
    catch (error) {

        console.error(
            "Complete task error:",
            error
        );


        alert(
            "Unable to connect to the server.\n\n" +
            "Please check your internet connection."
        );


        button.disabled = false;

        button.textContent =
            "Complete Task";

    }

}


/*
=========================================================
UPDATE PROGRESS
=========================================================
*/

function updateProgress() {

    let percent = 0;


    if (totalTasks > 0) {

        percent =
            (completed / totalTasks) * 100;

    }


    /*
    Never allow more than 100%
    */

    percent =
        Math.min(
            Math.max(percent, 0),
            100
        );


    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        completed +
        " of " +
        totalTasks +
        " tasks completed";

}


/*
=========================================================
ESCAPE HTML
=========================================================
*/

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
=========================================================
LOGOUT
=========================================================
*/

function logout() {

    localStorage.removeItem("token");

    /*
    Remove other possible authentication values
    if your application uses them.
    */

    localStorage.removeItem("authToken");

    window.location.href =
        "login.html";

}


/*
=========================================================
BACK BUTTON
=========================================================
*/

function goBack() {

    if (
        document.referrer &&
        history.length > 1
    ) {

        history.back();

    }
    else {

        window.location.href =
            "dashboard.html";

    }

}


/*
=========================================================
PAGE INITIALIZATION
=========================================================
*/

window.addEventListener(
    "load",
    async function () {

        /*
        First make sure user is logged in.
        */

        if (!checkAuthentication()) {
            return;
        }


        /*
        Load profile first.
        */

        const profileLoaded =
            await loadProfile();


        /*
        Only load tasks if profile
        authentication was successful.
        */

        if (profileLoaded) {

            await loadTasks();

        }

    }
);

</script>

</body>

</html>
