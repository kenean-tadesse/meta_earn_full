<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Earn | VIP Level 4</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#0b0b10;
color:#fff;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(
circle at top left,
#f59e0b 0%,
transparent 40%
),
radial-gradient(
circle at bottom right,
#eab308 0%,
transparent 40%
);
z-index:-1;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:15px;
}

.logo{
font-size:36px;
font-weight:900;
background:
linear-gradient(
90deg,
#fbbf24,
#fde68a
);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
}

#vipText{
margin-top:6px;
font-size:15px;
font-weight:600;
color:#fef3c7;
}

.logoutBtn{
background:#dc2626;
color:#fff;
border:none;
padding:12px 20px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

.logoutBtn:hover{
background:#b91c1c;
}

.cards{
display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(220px,1fr)
);
gap:20px;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,.06);
-webkit-backdrop-filter:blur(20px);
backdrop-filter:blur(20px);
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
}

.title{
font-size:14px;
opacity:.7;
margin-bottom:10px;
}

.value{
font-size:30px;
font-weight:bold;
}

.green{
color:#22c55e;
}

.gold{
color:#fbbf24;
}

.blue{
color:#38bdf8;
}

.progressBox{
background:rgba(255,255,255,.06);
padding:25px;
border-radius:20px;
margin-bottom:30px;
}

.progressBox h2{
margin-bottom:5px;
}

.progress{
height:18px;
background:#222;
border-radius:30px;
overflow:hidden;
margin-top:15px;
}

.progressFill{
width:0%;
height:100%;
background:
linear-gradient(
90deg,
#f59e0b,
#fde047
);
transition:.5s;
}

.progressText{
margin-top:10px;
font-size:14px;
color:#d1d5db;
}

.sectionTitle{
font-size:30px;
font-weight:800;
margin-bottom:20px;
}

.taskList{
display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(320px,1fr)
);
gap:20px;
}

.task{
background:rgba(255,255,255,.06);
padding:20px;
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
transition:.3s;
}

.task:hover{
transform:translateY(-5px);
}

.task h3{
margin-bottom:10px;
}

.task p{
opacity:.75;
margin-bottom:15px;
line-height:1.5;
}

.reward{
color:#22c55e;
font-weight:bold;
margin-bottom:15px;
}

.task button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:bold;
background:
linear-gradient(
90deg,
#f59e0b,
#facc15
);
color:#111;
transition:.2s;
}

.task button:hover:not(:disabled){
opacity:.9;
transform:translateY(-1px);
}

.task button:disabled{
cursor:not-allowed;
opacity:.8;
}

.completedButton{
background:#16a34a !important;
color:#fff !important;
}

.loading{
text-align:center;
padding:30px;
color:#d1d5db;
}

.errorBox{
background:rgba(220,38,38,.15);
border:1px solid rgba(248,113,113,.4);
padding:20px;
border-radius:15px;
color:#fecaca;
text-align:center;
}

.emptyBox{
background:rgba(255,255,255,.06);
padding:30px;
border-radius:15px;
text-align:center;
color:#d1d5db;
}

.footer{
text-align:center;
margin-top:50px;
opacity:.6;
padding-bottom:25px;
}

.back-button{
position:fixed;
top:20px;
left:20px;
width:50px;
height:50px;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
135deg,
#2563eb,
#06b6d4
);
color:#fff;
font-size:26px;
font-weight:bold;
border-radius:50%;
box-shadow:
0 8px 20px rgba(0,0,0,.25);
cursor:pointer;
z-index:9999;
border:none;
outline:none;
transition:.25s;
}

.back-button:hover{
background:
linear-gradient(
135deg,
#1d4ed8,
#0891b2
);
box-shadow:
0 12px 25px rgba(0,0,0,.35);
}

.back-button:active{
transform:scale(.96);
}

@media(max-width:600px){

.container{
padding:15px;
padding-top:85px;
}

.logo{
font-size:28px;
}

.sectionTitle{
font-size:24px;
}

.taskList{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<!-- BACK BUTTON -->

<button
class="back-button"
onclick="goBack()"
title="Back"
aria-label="Go back"
>
←
</button>


<div class="container">


<!-- HEADER -->

<div class="header">

<div>

<div class="logo">
META EARN
</div>

<div id="vipText">
VIP Level 4
</div>

</div>


<button
class="logoutBtn"
onclick="logout()"
>
Logout
</button>

</div>


<!-- CARDS -->

<div class="cards">


<!-- WALLET -->

<div class="card">

<div class="title">
Wallet Balance
</div>

<div class="value green">

<span id="balance">
0.00
</span>

ETB

</div>

</div>


<!-- VIP LEVEL -->

<div class="card">

<div class="title">
VIP Level
</div>

<div
class="value blue"
id="vipLevel"
>
4
</div>

</div>


<!-- COMPLETED -->

<div class="card">

<div class="title">
Completed Today
</div>

<div class="value gold">

<span id="completedCount">
0
</span>

</div>

</div>


<!-- AVAILABLE -->

<div class="card">

<div class="title">
Available Tasks
</div>

<div class="value">

<span id="taskCount">
0
</span>

</div>

</div>


</div>


<!-- PROGRESS -->

<div class="progressBox">

<h2>
Today's Progress
</h2>

<div class="progress">

<div
class="progressFill"
id="progressFill"
></div>

</div>

<div
class="progressText"
id="progressText"
>
0 of 0 tasks completed
</div>

</div>


<!-- TASK TITLE -->

<h2 class="sectionTitle">
VIP 4 Tasks
</h2>


<!-- TASK CONTAINER -->

<div
class="taskList"
id="taskContainer"
>

<div class="loading">
Loading VIP 4 Tasks...
</div>

</div>


<!-- FOOTER -->

<div class="footer">
© 2026 Meta Earn
</div>


</div>


<script>


/*
====================================================
META EARN VIP LEVEL 4
====================================================

PRODUCTION SERVER:

https://meta-earn-14.onrender.com

API:

https://meta-earn-14.onrender.com/api

IMPORTANT:
This page does NOT use localhost.
====================================================
*/


const API =
"https://meta-earn-14.onrender.com/api";


/*
====================================================
STATE
====================================================
*/

let token =
localStorage.getItem("token");

let completed = 0;

let totalTasks = 0;

let wallet = 0;

let vip = 4;


/*
====================================================
CHECK LOGIN
====================================================
*/

function checkAuthentication(){

token =
localStorage.getItem("token");

if(!token){

window.location.href =
"login.html";

return false;

}

return true;

}


/*
====================================================
SAFE JSON RESPONSE
====================================================
*/

async function getJsonResponse(response){

const contentType =
response.headers.get("content-type") || "";


if(
contentType.includes("application/json")
){

return await response.json();

}


await response.text();

throw new Error(
"Server returned a non-JSON response."
);

}


/*
====================================================
LOAD PROFILE
====================================================
*/

async function loadProfile(){

if(
!checkAuthentication()
){

return false;

}


try{

const response =
await fetch(
API + "/auth/profile",
{
method:"GET",

headers:{
"Authorization":
"Bearer " + token,

"Content-Type":
"application/json"
},

cache:"no-store"

}
);


/*
401 = INVALID TOKEN
*/

if(
response.status === 401
){

localStorage.removeItem(
"token"
);

window.location.href =
"login.html";

return false;

}


/*
OTHER HTTP ERROR
*/

if(
!response.ok
){

throw new Error(
"Profile HTTP error: " +
response.status
);

}


const data =
await getJsonResponse(
response
);


/*
CHECK API RESPONSE
*/

if(
!data ||
data.success !== true
){

console.error(
"Profile response:",
data
);

localStorage.removeItem(
"token"
);

window.location.href =
"login.html";

return false;

}


if(!data.user){

throw new Error(
"User information missing."
);

}


const user =
data.user;


/*
BALANCE
*/

wallet =
Number(
user.balance ?? 0
);


/*
VIP LEVEL

Your existing backend appears
to use vip_level.
*/

vip =
Number(
user.vip_level ??
user.level ??
0
);


/*
VIP 4 ACCESS
*/

if(
vip < 4
){

alert(
"VIP Level 4 membership is required."
);

window.location.href =
"dashboard.html";

return false;

}


/*
DISPLAY BALANCE
*/

document.getElementById(
"balance"
).textContent =
wallet.toFixed(2);


/*
DISPLAY VIP
*/

document.getElementById(
"vipLevel"
).textContent =
vip;


/*
DISPLAY VIP TEXT
*/

document.getElementById(
"vipText"
).textContent =
"VIP Level " + vip;


return true;

}
catch(error){

console.error(
"Profile error:",
error
);


document.getElementById(
"taskContainer"
).innerHTML = `

<div class="errorBox">

Unable to load your profile.

<br><br>

Please refresh the page
and try again.

</div>

`;


return false;

}

}


/*
====================================================
LOAD VIP 4 TASKS
====================================================
*/

async function loadTasks(){

if(
!checkAuthentication()
){

return;

}


const container =
document.getElementById(
"taskContainer"
);


container.innerHTML = `

<div class="loading">

Loading VIP 4 Tasks...

</div>

`;


try{

const response =
await fetch(
API + "/tasks",
{
method:"GET",

headers:{
"Authorization":
"Bearer " + token,

"Content-Type":
"application/json"
},

cache:"no-store"

}
);


/*
401
*/

if(
response.status === 401
){

localStorage.removeItem(
"token"
);

window.location.href =
"login.html";

return;

}


/*
HTTP ERROR
*/

if(
!response.ok
){

throw new Error(
"Tasks HTTP error: " +
response.status
);

}


const data =
await getJsonResponse(
response
);


/*
API ERROR
*/

if(
!data ||
data.success !== true
){

container.innerHTML = `

<div class="errorBox">

${
data?.message ||
"Unable to load tasks."
}

</div>

`;

return;

}


/*
GET TASK ARRAY
*/

const allTasks =
Array.isArray(
data.tasks
)
? data.tasks
: [];


/*
ONLY VIP 4 TASKS
*/

const tasks =
allTasks.filter(
function(task){

return Number(
task.required_vip
) === 4;

}
);


/*
TOTAL TASKS
*/

totalTasks =
tasks.length;


document.getElementById(
"taskCount"
).textContent =
totalTasks;


container.innerHTML =
"";


/*
NO TASKS
*/

if(
tasks.length === 0
){

container.innerHTML = `

<div class="emptyBox">

No VIP 4 Tasks
are currently available.

</div>

`;

completed = 0;

updateProgress();

return;

}


/*
CREATE TASKS
*/

tasks.forEach(
function(task){

const card =
document.createElement(
"div"
);

card.className =
"task";


const title =
escapeHtml(
task.title ??
"VIP 4 Task"
);


const description =
escapeHtml(
task.description ??
"Complete this task."
);


const reward =
Number(
task.commission ??
task.reward ??
0
);


const taskId =
task.id ??
task.task_id;


card.innerHTML = `

<h3>
${title}
</h3>

<p>
${description}
</p>

<div class="reward">

Reward :
${reward.toFixed(2)}
ETB

</div>

<button
type="button"
>

Complete Task

</button>

`;


const button =
card.querySelector(
"button"
);


button.addEventListener(
"click",
function(){

completeTask(
taskId,
button
);

}
);


container.appendChild(
card
);

}
);


updateProgress();

}
catch(error){

console.error(
"Tasks error:",
error
);


container.innerHTML = `

<div class="errorBox">

Unable to connect
to the task server.

<br><br>

Please refresh
and try again.

</div>

`;

}

}


/*
====================================================
COMPLETE VIP 4 TASK
====================================================
*/

async function completeTask(
taskId,
button
){

if(
!checkAuthentication()
){

return;

}


if(!taskId){

alert(
"Invalid task ID."
);

return;

}


button.disabled =
true;

button.textContent =
"Processing...";


try{

const response =
await fetch(
API +
"/tasks/complete/" +
encodeURIComponent(
taskId
),
{
method:"POST",

headers:{
"Authorization":
"Bearer " + token,

"Content-Type":
"application/json"
}

}
);


/*
401
*/

if(
response.status === 401
){

localStorage.removeItem(
"token"
);

window.location.href =
"login.html";

return;

}


const data =
await getJsonResponse(
response
);


/*
TASK FAILED
*/

if(
!response.ok ||
data.success !== true
){

alert(
data?.message ||
"Unable to complete this task."
);

button.disabled =
false;

button.textContent =
"Complete Task";

return;

}


/*
SUCCESS
*/

button.textContent =
"✔ Completed";

button.classList.add(
"completedButton"
);

button.disabled =
true;


/*
UPDATE BALANCE
*/

if(
data.balance !== undefined &&
data.balance !== null
){

wallet =
Number(
data.balance
);

}
else{

await loadProfile();

}


document.getElementById(
"balance"
).textContent =
wallet.toFixed(2);


/*
UPDATE COMPLETED COUNT
*/

completed++;


document.getElementById(
"completedCount"
).textContent =
completed;


updateProgress();


/*
REWARD
*/

const reward =
Number(
data.reward ??
data.commission ??
0
);


alert(

"🎉 Task Completed Successfully!\n\n" +

(
data.message ||
"VIP 4 task completed successfully."
) +

"\n\nReward : " +

reward.toFixed(2) +

" ETB"

);

}
catch(error){

console.error(
"Complete task error:",
error
);

alert(
"Unable to connect to the server."
);

button.disabled =
false;

button.textContent =
"Complete Task";

}

}


/*
====================================================
UPDATE PROGRESS
====================================================
*/

function updateProgress(){

let percent = 0;


if(
totalTasks > 0
){

percent =
(
completed /
totalTasks
) * 100;

}


percent =
Math.min(
Math.max(
percent,
0
),
100
);


document.getElementById(
"progressFill"
).style.width =
percent + "%";


document.getElementById(
"progressText"
).textContent =

completed +
" of " +
totalTasks +
" tasks completed";

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/*
====================================================
LOGOUT
====================================================
*/

function logout(){

localStorage.removeItem(
"token"
);

localStorage.removeItem(
"authToken"
);

window.location.href =
"login.html";

}


/*
====================================================
BACK
====================================================
*/

function goBack(){

if(
document.referrer &&
history.length > 1
){

history.back();

}
else{

window.location.href =
"dashboard.html";

}

}


/*
====================================================
PAGE LOAD
====================================================
*/

window.addEventListener(
"load",
async function(){

if(
!checkAuthentication()
){

return;

}


/*
FIRST:
LOAD PROFILE

SECOND:
LOAD TASKS
*/

const profileLoaded =
await loadProfile();


if(
profileLoaded
){

await loadTasks();

}

}
);


</script>

</body>

</html>
