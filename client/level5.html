<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Earn | VIP Level 5</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at top left,
            #f59e0b 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            #facc15 0%,
            transparent 35%
        );

    z-index:-1;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:30px;

    flex-wrap:wrap;
    gap:15px;
}

.logo{
    font-size:34px;
    font-weight:800;

    background:
        linear-gradient(
            90deg,
            #fbbf24,
            #fde68a
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
}

#vipText{
    margin-top:5px;

    color:#fef3c7;

    font-size:15px;
    font-weight:600;
}


/* =====================================================
   LOGOUT
===================================================== */

.logoutBtn{
    background:#dc2626;

    padding:10px 20px;

    border:none;
    border-radius:12px;

    color:white;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;
}

.logoutBtn:hover{
    background:#b91c1c;
}

.logoutBtn:active{
    transform:scale(.97);
}


/* =====================================================
   CARDS
===================================================== */

.cards{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:20px;

    margin-bottom:25px;
}

.card{
    background:rgba(255,255,255,.08);

    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);

    padding:25px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.1);
}

.title{
    opacity:.7;

    font-size:14px;

    margin-bottom:10px;
}

.value{
    font-size:30px;
    font-weight:bold;
}

.green{
    color:#22c55e;
}

.gold{
    color:#fbbf24;
}

.blue{
    color:#38bdf8;
}


/* =====================================================
   PROGRESS
===================================================== */

.progressBox{
    background:rgba(255,255,255,.08);

    padding:25px;

    border-radius:20px;

    margin-bottom:30px;
}

.progressBox h2{
    margin-bottom:5px;
}

.progress{
    height:18px;

    background:#1e293b;

    border-radius:30px;

    overflow:hidden;

    margin-top:15px;
}

.progressFill{
    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            #f59e0b,
            #fde047
        );

    transition:.5s;
}

.progressText{
    margin-top:10px;

    font-size:14px;

    color:#d1d5db;
}


/* =====================================================
   TASK SECTION
===================================================== */

.sectionTitle{
    font-size:28px;

    font-weight:700;

    margin-bottom:20px;
}

.taskList{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(320px,1fr)
        );

    gap:20px;
}

.task{
    background:rgba(255,255,255,.08);

    padding:20px;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.1);

    transition:.3s;
}

.task:hover{
    transform:translateY(-5px);
}

.task h3{
    margin-bottom:10px;
}

.task p{
    opacity:.7;

    margin-bottom:20px;

    line-height:1.5;
}

.reward{
    color:#22c55e;

    font-weight:bold;

    margin-bottom:15px;
}


/* =====================================================
   TASK BUTTON
===================================================== */

.task button{
    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

    background:
        linear-gradient(
            90deg,
            #f59e0b,
            #facc15
        );

    color:#111;

    transition:.2s;
}

.task button:hover:not(:disabled){
    opacity:.9;
}

.task button:disabled{
    cursor:not-allowed;

    opacity:.8;
}

.task button.completed{
    background:#16a34a !important;

    color:white !important;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.loading{
    text-align:center;

    padding:30px;

    color:#d1d5db;
}

.emptyBox{
    background:rgba(255,255,255,.08);

    padding:30px;

    border-radius:18px;

    text-align:center;

    color:#d1d5db;

    border:
        1px solid
        rgba(255,255,255,.1);
}

.errorBox{
    background:
        rgba(220,38,38,.15);

    border:
        1px solid
        rgba(248,113,113,.4);

    padding:20px;

    border-radius:15px;

    color:#fecaca;

    text-align:center;

    line-height:1.6;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    text-align:center;

    margin-top:50px;

    opacity:.6;

    padding-bottom:25px;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{
    position:fixed;

    top:20px;
    left:20px;

    width:50px;
    height:50px;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
        );

    color:#fff;

    text-decoration:none;

    font-size:26px;

    font-weight:bold;

    border-radius:50%;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.25);

    cursor:pointer;

    z-index:9999;

    border:none;

    outline:none;

    transition:.25s;
}

.back-button:hover{
    background:
        linear-gradient(
            135deg,
            #1d4ed8,
            #0891b2
        );

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.35);
}

.back-button:active{
    transform:scale(.96);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .container{
        padding:15px;

        padding-top:85px;
    }

    .logo{
        font-size:28px;
    }

    .sectionTitle{
        font-size:24px;
    }

    .taskList{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<!-- ===================================================
     BACK BUTTON
=================================================== -->

<button
    class="back-button"
    onclick="goBack()"
    title="Back"
    aria-label="Go back"
>
    ←
</button>


<div class="container">


<!-- ===================================================
     HEADER
=================================================== -->

<div class="header">

    <div>

        <div class="logo">
            META EARN
        </div>

        <div id="vipText">
            VIP Level 5
        </div>

    </div>


    <button
        class="logoutBtn"
        onclick="logout()"
    >
        Logout
    </button>

</div>


<!-- ===================================================
     DASHBOARD CARDS
=================================================== -->

<div class="cards">


    <!-- WALLET -->

    <div class="card">

        <div class="title">
            Wallet Balance
        </div>

        <div class="value green">

            <span id="balance">
                0.00
            </span>

            ETB

        </div>

    </div>


    <!-- VIP LEVEL -->

    <div class="card">

        <div class="title">
            VIP Level
        </div>

        <div
            class="value blue"
            id="vipLevel"
        >
            5
        </div>

    </div>


    <!-- COMPLETED -->

    <div class="card">

        <div class="title">
            Completed Today
        </div>

        <div class="value gold">

            <span id="completedCount">
                0
            </span>

        </div>

    </div>


    <!-- AVAILABLE TASKS -->

    <div class="card">

        <div class="title">
            Available Tasks
        </div>

        <div class="value">

            <span id="taskCount">
                0
            </span>

        </div>

    </div>

</div>


<!-- ===================================================
     PROGRESS
=================================================== -->

<div class="progressBox">

    <h2>
        Today's Progress
    </h2>

    <div class="progress">

        <div
            class="progressFill"
            id="progressFill"
        ></div>

    </div>

    <div
        class="progressText"
        id="progressText"
    >
        0 of 0 tasks completed
    </div>

</div>


<!-- ===================================================
     TASKS
=================================================== -->

<h2 class="sectionTitle">
    VIP 5 Tasks
</h2>


<div
    class="taskList"
    id="taskContainer"
>

    <div class="loading">
        Loading VIP 5 Tasks...
    </div>

</div>


<!-- ===================================================
     FOOTER
=================================================== -->

<div class="footer">
    © 2026 Meta Earn
</div>


</div>


<script>

/*
========================================================
META EARN - VIP LEVEL 5
========================================================

PRODUCTION SERVER:

https://meta-earn-14.onrender.com

API:

https://meta-earn-14.onrender.com/api

IMPORTANT:
This file does NOT use localhost:5000.
========================================================
*/


/* =====================================================
   API URL
===================================================== */

const API =
    "https://meta-earn-14.onrender.com/api";


/* =====================================================
   AUTH TOKEN
===================================================== */

let token =
    localStorage.getItem("token");


/* =====================================================
   VARIABLES
===================================================== */

let completed = 0;

let totalTasks = 0;

let wallet = 0;

let vip = 0;


/* =====================================================
   LOGIN CHECK
===================================================== */

function checkLogin(){

    token =
        localStorage.getItem("token");


    if(!token){

        window.location.href =
            "login.html";

        return false;
    }


    return true;
}


/* =====================================================
   LOAD USER PROFILE
===================================================== */

async function loadProfile(){

    if(!checkLogin()){

        return false;
    }


    try{

        const response =
            await fetch(
                API + "/auth/profile",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        /*
        -----------------------------------------------
        TOKEN EXPIRED / INVALID
        -----------------------------------------------
        */

        if(response.status === 401){

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return false;
        }


        /*
        -----------------------------------------------
        SERVER ERROR
        -----------------------------------------------
        */

        if(!response.ok){

            throw new Error(
                "Profile request failed: " +
                response.status
            );
        }


        /*
        -----------------------------------------------
        JSON
        -----------------------------------------------
        */

        const data =
            await response.json();


        console.log(
            "VIP 5 profile:",
            data
        );


        /*
        -----------------------------------------------
        API SUCCESS
        -----------------------------------------------
        */

        if(!data.success){

            alert(
                data.message ||
                "Unable to load profile."
            );

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return false;
        }


        if(!data.user){

            throw new Error(
                "User information was not returned."
            );
        }


        /*
        -----------------------------------------------
        USER DATA
        -----------------------------------------------
        */

        const user =
            data.user;


        /*
        -----------------------------------------------
        BALANCE
        -----------------------------------------------
        */

        wallet =
            Number(
                user.balance || 0
            );


        /*
        -----------------------------------------------
        VIP LEVEL
        -----------------------------------------------
        */

        vip =
            Number(
                user.vip_level || 0
            );


        /*
        -----------------------------------------------
        VIP 5 ACCESS
        -----------------------------------------------
        */

        if(vip < 5){

            alert(
                "VIP Level 5 membership is required."
            );

            window.location.href =
                "dashboard.html";

            return false;
        }


        /*
        -----------------------------------------------
        DISPLAY BALANCE
        -----------------------------------------------
        */

        document.getElementById(
            "balance"
        ).textContent =
            wallet.toFixed(2);


        /*
        -----------------------------------------------
        DISPLAY VIP
        -----------------------------------------------
        */

        document.getElementById(
            "vipLevel"
        ).textContent =
            vip;


        document.getElementById(
            "vipText"
        ).textContent =
            "VIP Level " + vip;


        return true;

    }
    catch(error){

        console.error(
            "loadProfile error:",
            error
        );


        document.getElementById(
            "taskContainer"
        ).innerHTML = `

            <div class="errorBox">

                Unable to connect to the
                Meta Earn server.

                <br><br>

                Please check your internet
                connection and refresh the page.

            </div>

        `;


        return false;
    }

}


/* =====================================================
   LOAD VIP 5 TASKS
===================================================== */

async function loadTasks(){

    if(!checkLogin()){

        return;
    }


    const container =
        document.getElementById(
            "taskContainer"
        );


    container.innerHTML = `

        <div class="loading">

            Loading VIP 5 Tasks...

        </div>

    `;


    try{

        const response =
            await fetch(
                API + "/tasks",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        /*
        -----------------------------------------------
        TOKEN ERROR
        -----------------------------------------------
        */

        if(response.status === 401){

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return;
        }


        /*
        -----------------------------------------------
        HTTP ERROR
        -----------------------------------------------
        */

        if(!response.ok){

            throw new Error(
                "Tasks request failed: " +
                response.status
            );
        }


        /*
        -----------------------------------------------
        JSON
        -----------------------------------------------
        */

        const data =
            await response.json();


        console.log(
            "VIP 5 tasks:",
            data
        );


        if(!data.success){

            container.innerHTML = `

                <div class="errorBox">

                    ${
                        data.message ||
                        "Unable to load tasks."
                    }

                </div>

            `;

            return;
        }


        /*
        -----------------------------------------------
        ALL TASKS
        -----------------------------------------------
        */

        const allTasks =
            Array.isArray(data.tasks)
                ? data.tasks
                : [];


        /*
        -----------------------------------------------
        ONLY VIP 5 TASKS
        -----------------------------------------------
        */

        const tasks =
            allTasks.filter(
                task =>
                    Number(
                        task.required_vip
                    ) === 5
            );


        /*
        -----------------------------------------------
        TOTAL TASKS
        -----------------------------------------------
        */

        totalTasks =
            tasks.length;


        document.getElementById(
            "taskCount"
        ).textContent =
            totalTasks;


        /*
        -----------------------------------------------
        CLEAR
        -----------------------------------------------
        */

        container.innerHTML =
            "";


        /*
        -----------------------------------------------
        NO TASKS
        -----------------------------------------------
        */

        if(tasks.length === 0){

            container.innerHTML = `

                <div class="emptyBox">

                    No VIP 5 Tasks Available.

                </div>

            `;

            updateProgress();

            return;
        }


        /*
        -----------------------------------------------
        CREATE TASK CARDS
        -----------------------------------------------
        */

        tasks.forEach(
            task => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "task";


                const title =
                    task.title ||
                    "VIP 5 Task";


                const description =
                    task.description ||
                    "Complete this task.";


                const commission =
                    Number(
                        task.commission || 0
                    );


                const taskId =
                    task.id;


                card.innerHTML = `

                    <h3>
                        ${escapeHtml(title)}
                    </h3>

                    <p>
                        ${escapeHtml(description)}
                    </p>

                    <div class="reward">

                        Reward:
                        ${commission.toFixed(2)}
                        ETB

                    </div>

                    <button
                        type="button"
                    >
                        Complete Task
                    </button>

                `;


                const button =
                    card.querySelector(
                        "button"
                    );


                button.addEventListener(
                    "click",
                    function(){

                        completeTask(
                            taskId,
                            button
                        );

                    }
                );


                container.appendChild(
                    card
                );

            }
        );


        updateProgress();

    }
    catch(error){

        console.error(
            "loadTasks error:",
            error
        );


        container.innerHTML = `

            <div class="errorBox">

                Unable to load VIP 5 tasks.

                <br><br>

                Please refresh the page.

            </div>

        `;

    }

}


/* =====================================================
   COMPLETE TASK
===================================================== */

async function completeTask(
    taskId,
    button
){

    if(!checkLogin()){

        return;
    }


    if(!taskId){

        alert(
            "Invalid task ID."
        );

        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Processing...";


    try{

        const response =
            await fetch(
                API +
                "/tasks/complete/" +
                encodeURIComponent(
                    taskId
                ),
                {
                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        /*
        -----------------------------------------------
        TOKEN ERROR
        -----------------------------------------------
        */

        if(response.status === 401){

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return;
        }


        /*
        -----------------------------------------------
        RESPONSE
        -----------------------------------------------
        */

        const data =
            await response.json();


        console.log(
            "VIP 5 complete response:",
            data
        );


        /*
        -----------------------------------------------
        FAILED
        -----------------------------------------------
        */

        if(
            !response.ok ||
            !data.success
        ){

            alert(
                data.message ||
                "Unable to complete task."
            );


            button.disabled =
                false;

            button.textContent =
                "Complete Task";

            return;
        }


        /*
        -----------------------------------------------
        SUCCESS
        -----------------------------------------------
        */

        button.textContent =
            "✔ Completed";


        button.classList.add(
            "completed"
        );


        button.disabled =
            true;


        /*
        -----------------------------------------------
        UPDATE BALANCE
        -----------------------------------------------
        */

        if(
            data.balance !== undefined &&
            data.balance !== null
        ){

            wallet =
                Number(
                    data.balance
                );

        }
        else{

            await loadProfile();

        }


        document.getElementById(
            "balance"
        ).textContent =
            wallet.toFixed(2);


        /*
        -----------------------------------------------
        COMPLETED COUNT
        -----------------------------------------------
        */

        completed++;


        document.getElementById(
            "completedCount"
        ).textContent =
            completed;


        /*
        -----------------------------------------------
        UPDATE PROGRESS
        -----------------------------------------------
        */

        updateProgress();


        /*
        -----------------------------------------------
        REWARD
        -----------------------------------------------
        */

        const reward =
            Number(
                data.reward || 0
            );


        alert(

            "🎉 Congratulations!\n\n" +

            (
                data.message ||
                "VIP 5 task completed successfully."
            ) +

            "\n\nReward: " +

            reward.toFixed(2) +

            " ETB"

        );

    }
    catch(error){

        console.error(
            "completeTask error:",
            error
        );


        alert(
            "Unable to connect to the server."
        );


        button.disabled =
            false;

        button.textContent =
            "Complete Task";

    }

}


/* =====================================================
   UPDATE PROGRESS
===================================================== */

function updateProgress(){

    let percentage =
        0;


    if(totalTasks > 0){

        percentage =
            (
                completed /
                totalTasks
            ) * 100;

    }


    if(percentage > 100){

        percentage = 100;

    }


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";


    document.getElementById(
        "progressText"
    ).textContent =

        completed +
        " of " +
        totalTasks +
        " tasks completed";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        "token"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   BACK BUTTON
===================================================== */

function goBack(){

    if(
        document.referrer &&
        history.length > 1
    ){

        history.back();

    }
    else{

        window.location.href =
            "dashboard.html";

    }

}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    async function(){

        /*
        -----------------------------------------------
        CHECK LOGIN
        -----------------------------------------------
        */

        if(!checkLogin()){

            return;
        }


        /*
        -----------------------------------------------
        LOAD PROFILE FIRST
        -----------------------------------------------
        */

        const profileLoaded =
            await loadProfile();


        /*
        -----------------------------------------------
        LOAD TASKS ONLY AFTER
        PROFILE IS VALID
        -----------------------------------------------
        */

        if(profileLoaded){

            await loadTasks();

        }

    }
);

</script>

</body>

</html>
